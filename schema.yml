      description: Allowed fields for the authenticated user's own profile (`/api/users/me/`).
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^\+?[0-9]{7,15}$
            maxLength: 20
          - type: string
            maxLength: 0
        avatar:
          type: string
          format: binary
          nullable: true
    PatchedUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 140
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^\+?[0-9]{7,15}$
            maxLength: 20
          - type: string
            maxLength: 0
        avatar:
          type: string
          format: binary
          nullable: true
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: integer
        reset_token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
        new_password_confirm:
          type: string
          minLength: 1
      required:
      - email
      - new_password
      - new_password_confirm
    SendOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code_type:
          $ref: '#/components/schemas/CodeTypeEnum'
      required:
      - code_type
      - email
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          minLength: 1
          default: ''
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          default: ''
          maxLength: 150
        phone:
          type: string
          minLength: 1
          default: ''
          maxLength: 20
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          default: buyer
      required:
      - email
      - password
    SignupResponse:
      type: object
      properties:
        message:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - message
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
    TokenResponse:
      type: object
      description: JWT payload returned by login and signup verification.
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          $ref: '#/components/schemas/User'
        message:
          type: string
      required:
      - tokens
      - user
    UnitOfMeasure:
      type: object
      description: |-
        Base serializer integrating with django-modeltranslation TranslationOptions.
        Automatically discovers and includes translated fields (e.g. name_en, name_ar)
        based on the specified translation_options.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        name_en:
          type: string
          nullable: true
          title: Name [en]
          maxLength: 50
        name_ar:
          type: string
          nullable: true
          title: Name [ar]
          maxLength: 50
        code:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    UnitOfMeasureRequest:
      type: object
      description: |-
        Base serializer integrating with django-modeltranslation TranslationOptions.
        Automatically discovers and includes translated fields (e.g. name_en, name_ar)
        based on the specified translation_options.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        name_en:
          type: string
          nullable: true
          title: Name [en]
          maxLength: 50
        name_ar:
          type: string
          nullable: true
          title: Name [ar]
          maxLength: 50
        code:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - code
      - name
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 140
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^\+?[0-9]{7,15}$
            maxLength: 20
          - type: string
            maxLength: 0
        avatar:
          type: string
          format: uri
          nullable: true
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
      required:
      - email
      - id
      - is_verified
      - user_type
    UserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 140
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^\+?[0-9]{7,15}$
            maxLength: 20
          - type: string
            maxLength: 0
        avatar:
          type: string
          format: binary
          nullable: true
      required:
      - email
    UserTypeEnum:
      enum:
      - buyer
      - seller
      - admin
      type: string
      description: |-
        * `buyer` - Buyer
        * `seller` - Seller
        * `admin` - Admin
    VerifyOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: integer
        code_type:
          $ref: '#/components/schemas/CodeTypeEnum'
      required:
      - code
      - code_type
      - email
    VerifyOtpResponse:
      type: object
      description: |-
        Verify-OTP response.
        SIGNUP flow returns `tokens` + `user`; password flows return a signed `reset_token`.
      properties:
        message:
          type: string
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          $ref: '#/components/schemas/User'
        reset_token:
          type: string
      required:
      - message
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
