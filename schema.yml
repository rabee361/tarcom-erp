openapi: 3.0.3
info:
  title: Tarcom E-Commerce API
  version: 1.0.0
  description: REST API for Tarcom E-Store and Flutter mobile application
paths:
  /api/auth/forget-password/:
    post:
      operationId: auth_forget_password_create
      description: Generates a RESET_PASSWORD OTP for the given email.
      summary: Start password recovery
      tags:
      - OTP & Password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Returns JWT tokens and the user profile for a verified, active
        account.
      summary: Log in with email and password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      description: Accepts either a `code` (OTP) or a `reset_token` issued by verify-otp.
      summary: Reset the account password
      tags:
      - OTP & Password
      requestBody:
        content:
          application/json:
