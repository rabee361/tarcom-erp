openapi: 3.0.3
info:
  title: Tarcom E-Commerce API
  version: 1.0.0
  description: REST API for Tarcom E-Store and Flutter mobile application
paths:
  /api/auth/forget-password/:
    post:
      operationId: auth_forget_password_create
      description: Generates a RESET_PASSWORD OTP for the given email.
      summary: Start password recovery
      tags:
      - OTP & Password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Returns JWT tokens and the user profile for a verified, active
        account.
      summary: Log in with email and password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      description: Accepts either a `code` (OTP) or a `reset_token` issued by verify-otp.
      summary: Reset the account password
      tags:
      - OTP & Password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/send-otp/:
    post:
      operationId: auth_send_otp_create
      description: 'Rate limited: at most 5 codes per email within 15 minutes.'
      summary: Send an OTP code by email
      tags:
      - OTP & Password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/signup/:
    post:
      operationId: auth_signup_create
      description: Creates an unverified user and generates a SIGNUP OTP code.
      summary: Create a new account
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: POST a `refresh` token to obtain a new `access` token.
      summary: Refresh the access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      description: 'SIGNUP: marks the account verified and returns JWT tokens. Password
        flows: returns a signed `reset_token` valid for 10 minutes.'
      summary: Verify an OTP code
      tags:
      - OTP & Password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      summary: List material categories
      parameters:
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -created_at
            - -name
            - created_at
            - name
        description: |-
          Which field to use when ordering the results.

          * `name` - Name
          * `-name` - Name (descending)
          * `created_at` - Created at
          * `-created_at` - Created at (descending)
        explode: false
        style: form
      - in: query
        name: parent
        schema:
          type: string
        description: Filter by parent category id, or one of `null`/`none`/`root`
          for top-level categories.
      - in: query
        name: search
        schema:
          type: string
        description: A search term.
      tags:
      - Categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaterialCategory'
          description: ''
    post:
      operationId: categories_create
      summary: Create a material category (admin only)
      tags:
      - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCategory'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      summary: Retrieve a material category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Material Category.
        required: true
      tags:
      - Categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCategory'
          description: ''
    put:
      operationId: categories_update
      summary: Replace a material category (admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Material Category.
        required: true
      tags:
      - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaterialCategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCategory'
          description: ''
    patch:
      operationId: categories_partial_update
      summary: Partially update a material category (admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Material Category.
        required: true
      tags:
      - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMaterialCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMaterialCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMaterialCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCategory'
          description: ''
    delete:
      operationId: categories_destroy
      summary: Delete a material category (admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Material Category.
        required: true
      tags:
      - Categories
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/categories/tree/:
    get:
      operationId: categories_tree_retrieve
      description: Returns root categories with nested subcategories.
      summary: Get the category tree
      tags:
      - Categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialCategory'
          description: ''
  /api/favourites/:
    get:
      operationId: favourites_list
      summary: List user favourites
      parameters:
      - in: query
        name: name
        schema:
          type: string
        description: Filter by favourite item name.
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -created_at
            - created_at
        description: |-
          Which field to use when ordering the results.

          * `created_at` - Created at
          * `-created_at` - Created at (descending)
        explode: false
        style: form
      tags:
      - Favourites
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavouriteItem'
          description: ''
    post:
      operationId: favourites_create
      summary: Add material to favourites
      tags:
      - Favourites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavouriteCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FavouriteCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FavouriteCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavouriteCreate'
          description: ''
  /api/favourites/{id}/:
    get:
      operationId: favourites_retrieve
      summary: Retrieve favourite item details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this favourite item.
        required: true
      tags:
      - Favourites
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavouriteItem'
          description: ''
    delete:
      operationId: favourites_destroy
      summary: Remove item from favourites by favourite ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this favourite item.
        required: true
      tags:
      - Favourites
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/favourites/check/:
    get:
      operationId: favourites_check_retrieve
      summary: Check if material is in favourites
      parameters:
      - in: query
        name: material
        schema:
          type: integer
        description: Material ID to check
        required: true
      tags:
      - Favourites
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavouriteToggleResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/favourites/remove-by-material/{material_id}/:
    delete:
      operationId: favourites_remove_by_material_destroy
      summary: Remove material from favourites by material ID
      parameters:
      - in: path
        name: material_id
        schema:
          type: integer
        required: true
      tags:
      - Favourites
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/favourites/toggle/:
    post:
      operationId: favourites_toggle_create
      description: If the material is already in favourites, it is removed; otherwise,
        it is added.
      summary: Toggle favourite status for a material
      tags:
      - Favourites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavouriteCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FavouriteCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FavouriteCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavouriteToggleResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/materials/:
    get:
      operationId: materials_list
      summary: List materials
      parameters:
      - in: query
        name: category
        schema:
          type: integer
        description: Filter by category id.
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by active flag (true/false).
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -consumer_price
            - -created_at
            - -name
            - -supplier_price
            - consumer_price
            - created_at
            - name
            - supplier_price
        description: |-
          Which field to use when ordering the results.

          * `consumer_price` - Consumer price
          * `-consumer_price` - Consumer price (descending)
          * `supplier_price` - Supplier price
          * `-supplier_price` - Supplier price (descending)
          * `created_at` - Created at
          * `-created_at` - Created at (descending)
          * `name` - Name
          * `-name` - Name (descending)
        explode: false
        style: form
      - in: query
        name: search
        schema:
          type: string
        description: A search term.
      tags:
      - Materials
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
          description: ''
    post:
      operationId: materials_create
      summary: Create a material
      tags:
      - Materials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
          description: ''
  /api/materials/{id}/:
    get:
      operationId: materials_retrieve
      summary: Retrieve a material
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this material.
        required: true
      tags:
      - Materials
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
          description: ''
    put:
      operationId: materials_update
      summary: Replace a material
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this material.
        required: true
      tags:
      - Materials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
          description: ''
    patch:
      operationId: materials_partial_update
      summary: Partially update a material
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this material.
        required: true
      tags:
      - Materials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMaterialRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMaterialRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMaterialRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
          description: ''
    delete:
      operationId: materials_destroy
      summary: Delete a material
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this material.
        required: true
      tags:
      - Materials
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/orders/:
    get:
      operationId: orders_list
      description: Customers see only their own orders. Staff and admins see all orders
        across the system.
      summary: List orders
      parameters:
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -created_at
            - -status
            - -total_amount
            - created_at
            - status
            - total_amount
        description: |-
          Which field to use when ordering the results.

          * `created_at` - Created at
          * `-created_at` - Created at (descending)
          * `total_amount` - Total amount
          * `-total_amount` - Total amount (descending)
          * `status` - Status
          * `-status` - Status (descending)
        explode: false
        style: form
      - in: query
        name: payment_status
        schema:
          type: string
          enum:
          - PAID
          - REFUNDED
          - UNPAID
        description: |-
          Filter by payment status.

          * `UNPAID` - Unpaid
          * `PAID` - Paid
          * `REFUNDED` - Refunded
      - in: query
        name: search
        schema:
          type: string
        description: A search term.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - CONFIRMED
          - DELIVERED
          - PENDING
          - SHIPPED
        description: |-
          Filter by order status.

          * `PENDING` - Pending
          * `CONFIRMED` - Confirmed
          * `SHIPPED` - Shipped
          * `DELIVERED` - Delivered
          * `CANCELLED` - Cancelled
      tags:
      - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderList'
          description: ''
    post:
      operationId: orders_create
      summary: Create/place an order (Checkout)
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreate'
          description: ''
  /api/orders/{id}/:
    get:
      operationId: orders_retrieve
      summary: Retrieve order details with items
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
    patch:
      operationId: orders_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/orders/{id}/cancel/:
    post:
      operationId: orders_cancel_create
      description: Customers can cancel their own order only while status is PENDING.
        Admins can cancel anytime prior to delivery.
      summary: Cancel an order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
