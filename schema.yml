  schemas:
    CodeTypeEnum:
      enum:
      - SIGNUP
      - RESET_PASSWORD
      - FORGET_PASSWORD
      type: string
      description: |-
        * `SIGNUP` - Signup
        * `RESET_PASSWORD` - Reset Password
        * `FORGET_PASSWORD` - Forget Password
