            maxLength: 0
        avatar:
          type: string
          format: uri
          nullable: true
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
      required:
      - email
      - id
      - is_verified
      - user_type
    UserProfileUpdateRequest:
      type: object
      description: |-
        Allowed fields for the authenticated user's own profile (`/api/users/me/`).
        Includes avatar format and file size validation (<= 2MB).
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^\+963[0-9]{9}$
            maxLength: 20
          - type: string
            maxLength: 0
        avatar:
          type: string
          format: binary
          nullable: true
    UserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 140
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^\+963[0-9]{9}$
            maxLength: 20
          - type: string
            maxLength: 0
        avatar:
          type: string
          format: binary
          nullable: true
      required:
      - email
    UserTypeEnum:
      enum:
      - supplier
      - customer
      - admin
      type: string
      description: |-
        * `supplier` - Supplier
        * `customer` - Customer
        * `admin` - Admin
    VerifyOtpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: integer
        code_type:
          $ref: '#/components/schemas/CodeTypeEnum'
      required:
      - code
      - code_type
      - email
    VerifyOtpResponse:
      type: object
      description: |-
        Verify-OTP response.
        SIGNUP flow returns `tokens` + `user`; password flows return a signed `reset_token`.
      properties:
        message:
          type: string
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          $ref: '#/components/schemas/User'
        reset_token:
          type: string
      required:
      - message
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
