  /api/categories/:
    get:
      operationId: categories_list
      summary: List material categories
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: parent
        schema:
          type: string
        description: Filter by parent category id, or one of `null`/`none`/`root`
          for top-level categories.
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaterialCategory'
          description: ''
