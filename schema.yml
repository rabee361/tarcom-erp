components:
  schemas:
    AccountDeactivateRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    ChangePasswordRequest:
      type: object
      description: |-
        Serializer for authenticated user changing password.
        Requires current password confirmation and new password validation.
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - new_password_confirm
      - old_password
    CodeTypeEnum:
      enum:
      - SIGNUP
      - RESET_PASSWORD
      - FORGET_PASSWORD
      type: string
      description: |-
        * `SIGNUP` - Signup
        * `RESET_PASSWORD` - Reset Password
        * `FORGET_PASSWORD` - Forget Password
    ErrorResponse:
      type: object
      description: Standard envelope returned for every DRF error response.
      properties:
        status:
          type: string
        code:
          type: integer
        message:
          type: string
        errors: {}
      required:
      - code
      - errors
      - message
      - status
    FavouriteCreate:
      type: object
      properties:
        material:
          type: integer
          description: ID of the material to favourite.
      required:
      - material
    FavouriteCreateRequest:
      type: object
      properties:
        material:
          type: integer
          description: ID of the material to favourite.
      required:
      - material
    FavouriteItem:
      type: object
      description: Read serializer with nested material details.
      properties:
        id:
          type: integer
          readOnly: true
        material:
          type: integer
        material_detail:
          allOf:
          - $ref: '#/components/schemas/MaterialCompact'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - material
      - material_detail
    FavouriteToggleResponse:
      type: object
      properties:
        is_favourite:
          type: boolean
        message:
          type: string
      required:
      - is_favourite
      - message
    ForgetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    Material:
      type: object
      description: |-
        Base serializer integrating with django-modeltranslation TranslationOptions.
        Automatically discovers and includes translated fields (e.g. name_en, name_ar)
        based on the specified translation_options.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        name_en:
          type: string
          nullable: true
          title: Name [en]
          maxLength: 150
        name_ar:
          type: string
          nullable: true
          title: Name [ar]
          maxLength: 150
        description:
          type: string
        description_en:
          type: string
          nullable: true
          title: Description [en]
        description_ar:
          type: string
          nullable: true
          title: Description [ar]
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        category_detail:
          allOf:
          - $ref: '#/components/schemas/MaterialCategoryChild'
          readOnly: true
        uom:
          type: integer
        uom_name:
          type: string
          readOnly: true
        uom_detail:
          allOf:
          - $ref: '#/components/schemas/UnitOfMeasure'
          readOnly: true
        supplier_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        consumer_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        expire_date:
          type: string
          nullable: true
        spec_key1:
          type: string
          nullable: true
          maxLength: 100
        spec_key2:
          type: string
          nullable: true
          maxLength: 100
        spec_key3:
          type: string
          nullable: true
          maxLength: 100
        spec_key4:
          type: string
          nullable: true
          maxLength: 100
        spec_key5:
          type: string
          nullable: true
          maxLength: 100
        spec_val1:
          type: string
          nullable: true
          maxLength: 100
        spec_val2:
          type: string
          nullable: true
          maxLength: 100
        spec_val3:
          type: string
          nullable: true
          maxLength: 100
        spec_val4:
          type: string
          nullable: true
          maxLength: 100
        spec_val5:
          type: string
          nullable: true
          maxLength: 100
        image1:
          type: string
          format: uri
          nullable: true
        image2:
          type: string
          format: uri
          nullable: true
        image3:
          type: string
          format: uri
          nullable: true
        image4:
          type: string
          format: uri
          nullable: true
        image5:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - category_detail
      - category_name
      - created_at
      - id
      - name
      - uom
      - uom_detail
      - uom_name
      - updated_at
    MaterialCategory:
      type: object
      description: |-
        Base serializer integrating with django-modeltranslation TranslationOptions.
        Automatically discovers and includes translated fields (e.g. name_en, name_ar)
        based on the specified translation_options.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        name_en:
          type: string
          nullable: true
          title: Name [en]
          maxLength: 100
        name_ar:
          type: string
          nullable: true
          title: Name [ar]
          maxLength: 100
        parent:
          type: integer
          nullable: true
        subcategories:
