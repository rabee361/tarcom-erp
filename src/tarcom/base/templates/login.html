{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'assets/css/main.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>Tarcom - تسجيل الدخول</title>
    <link rel="icon" href="{% static 'assets/images/tarcom.png' %}">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <div class="tarcom-image-container">
                <img src="{% static 'assets/images/tarcom.png' %}" class="tarcom-image" alt="Tarcom Logo">
            </div>
            <h1 class="login-text">
                تسجيل الدخول
            </h1>
        </div>
        <form class="login-form" action="" method="post">
            {% csrf_token %}
            <label for="phonenumber">رقم الهاتف أو البريد الإلكتروني:</label>
            <div class="input">
                <input type="text" placeholder="رقم الهاتف أو البريد" name="phonenumber" 
                       value="{{ phonenumber|default:'' }}"
                       class="{% if phone_error %}error{% endif %}">
            </div>
            <label for="password">كلمة المرور:</label>
            <div class="input password-input-wrapper">
                <input type="password" id="loginPassword" placeholder="كلمة المرور" name="password" class="{% if password_error %}error{% endif %}">
                <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Toggle password visibility">
                    <i class="fas fa-eye-slash"></i>
                </button>
            </div>
            <div class="remember-me-checkbox">
                <label for="remember-me">تذكرني</label>
                <input type="checkbox" id="remember-me" name="remember-me">
            </div>
            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>
    </div>
    <script src="{% static 'assets/min/js/main.min.js' %}"></script>
</body>
</html>
