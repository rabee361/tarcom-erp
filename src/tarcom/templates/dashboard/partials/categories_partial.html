{% for category in categories %}
<tr onclick="clickHandler(event)" data-link="{% url 'category-edit' category.pk %}">
    <td onclick="event.stopPropagation();"><input type="checkbox" class="row-checkbox" value="{{ category.id }}"></td>
    <td>
        {% if category.image %}
            <img src="{{ category.image.crop.40x40 }}" alt="{{ category.name_ar }}" width="40" height="40">
        {% else %}
            -
        {% endif %}
    </td>
    <td>{{ category.name_ar }}</td>
    <td>{{ category.materials.count }}</td>
    <td onclick="event.stopPropagation();">
        <div class="row-actions">
            <button type="button" class="btn-white js-delete-btn" data-delete-url="{% url 'category-delete' category.pk %}" data-object-name="{{ category.name_ar }}">🗑️</button>
        </div>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="5">لا توجد تصنيفات.</td>
</tr>
{% endfor %}
