{% load static %}

{% for category in categories %}
<tr onclick="clickHandler(event)" data-link="{% url 'category-edit' category.pk %}">
    <td>
        {% if category.icon %}
            <img src="{% static category.icon %}" alt="{{ category.name_ar }}" style="max-width:40px;max-height:40px;object-fit:cover;border-radius:6px;">
        {% else %}
            -
        {% endif %}
    </td>
    <td>{{ category.name_ar }}</td>
    <td>{{ category.materials.count }}</td>
    <td>
        <div class="row-actions">
            <button type="button" class="btn-white js-delete-btn" data-delete-url="{% url 'category-delete' category.pk %}" data-object-name="{{ category.name_ar }}">🗑️</button>
        </div>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4">لا توجد تصنيفات.</td>
</tr>
{% endfor %}
