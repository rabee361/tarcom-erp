{% for unit in units %}
<tr onclick="clickHandler(event)" data-link="{% url 'unit-edit' unit.pk %}">
    <td>{{ unit.name_ar }}</td>
    <td>{{ unit.code }}</td>
    <td>{{ unit.materials.count }}</td>
    <td>
        <div class="row-actions">
            <button type="button" class="btn-white js-delete-btn" data-delete-url="{% url 'unit-delete' unit.pk %}" data-object-name="{{ unit }}" title="حذف" aria-label="حذف {{ unit }}">🗑️</button>
        </div>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4">لا توجد وحدات قياس.</td>
</tr>
{% endfor %}
